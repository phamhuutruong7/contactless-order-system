# Nginx site config — Contactless Order System
#
# Deploy to VM: sudo cp ~/app/nginx/app.conf /etc/nginx/sites-available/app
#                sudo ln -sf /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
#                sudo nginx -t && sudo systemctl reload nginx
#
# Upstream is defined separately in /etc/nginx/conf.d/upstream.conf
# (managed by scripts/switch-stack.sh)

server {
    listen 80;
    server_name _;

    # ── API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── SignalR / WebSocket (hub) ─────────────────────────────────
    location /hub/ {
        proxy_pass         http://api_backend/hub/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # ── Frontend (Vue 3 SPA) ──────────────────────────────────────
    location / {
        proxy_pass         http://frontend_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
