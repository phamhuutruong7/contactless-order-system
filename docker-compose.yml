# Dev environment — single stack
# Usage: docker compose --env-file .env up -d
#
# Requires .env with:  IMAGE_API, IMAGE_FRONTEND, DATABASE_URL,
#   SUPABASE_URL, SUPABASE_JWT_SECRET, STAFF_JWT_SECRET
#
# App source paths when building locally:
#   API:      ./src/Api     (ASP.NET Core 8 Minimal API)
#   Frontend: ./src/Web     (Vue 3 + Vite)

services:
  api:
    image: ${IMAGE_API}
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DATABASE_URL}
      Supabase__Url: ${SUPABASE_URL}
      Supabase__JwtSecret: ${SUPABASE_JWT_SECRET}
      Staff__JwtSecret: ${STAFF_JWT_SECRET}
    restart: unless-stopped

  frontend:
    image: ${IMAGE_FRONTEND}
    ports:
      - "5001:80"
    restart: unless-stopped
