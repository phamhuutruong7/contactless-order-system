name: Deploy Prod (Blue-Green)

on:
  push:
    branches: [main]

env:
  GHCR_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build & push API image ───────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./src/Api
          push: true
          tags: |
            ${{ env.GHCR_PREFIX }}/api:prod-${{ github.sha }}
            ${{ env.GHCR_PREFIX }}/api:prod-latest

      # ── Build & push Frontend image ──────────────────────────────
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/Web
          push: true
          tags: |
            ${{ env.GHCR_PREFIX }}/frontend:prod-${{ github.sha }}
            ${{ env.GHCR_PREFIX }}/frontend:prod-latest

      # ── Blue-Green deploy on Prod VM ─────────────────────────────
      - name: Blue-Green Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          # script_stop: true  ← appleboy uses set -e internally
          script: |
            set -euo pipefail
            cd ~/app

            # Log in to GHCR from the VM
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── 1. Determine active / inactive color ──────────────
            ACTIVE=$(cat /opt/active-stack 2>/dev/null || echo "blue")
            if [[ "$ACTIVE" == "blue" ]]; then
              INACTIVE="green"
            else
              INACTIVE="blue"
            fi
            echo "Active: $ACTIVE  →  Deploying to: $INACTIVE"

            # ── 2. Write env file for inactive stack ──────────────
            cat > .env.${INACTIVE} << 'EOF'
            IMAGE_API=${{ env.GHCR_PREFIX }}/api:prod-${{ github.sha }}
            IMAGE_FRONTEND=${{ env.GHCR_PREFIX }}/frontend:prod-${{ github.sha }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
            STAFF_JWT_SECRET=${{ secrets.STAFF_JWT_SECRET }}
            EOF

            # ── 3. Pull images and start inactive stack ────────────
            docker compose --env-file .env.${INACTIVE} -f docker-compose.${INACTIVE}.yml pull
            docker compose --env-file .env.${INACTIVE} -f docker-compose.${INACTIVE}.yml up -d

            # ── 4. Health check (waits up to 150s) ────────────────
            bash scripts/health-check.sh "${INACTIVE}"

            # ── 5. Switch Nginx to inactive stack (now live) ───────
            sudo bash scripts/switch-stack.sh "${INACTIVE}"

            # ── 6. Stop old active stack ───────────────────────────
            docker compose -f docker-compose.${ACTIVE}.yml down

            docker image prune -f
            echo "Prod deployment complete. Live stack: ${INACTIVE}  ($(date -u))"
